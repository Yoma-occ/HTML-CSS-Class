<!-- 
================================================================================
DOCTYPE Declaration
================================================================================
Tells the browser this is an HTML5 document.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- 
  ================================================================================
  Character Encoding
  ================================================================================
  Ensures proper display of all text and special characters.
  -->
  <meta charset="utf-8" />

  <!-- 
  ================================================================================
  Viewport Meta Tag
  ================================================================================
  Makes the page responsive on mobile devices.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 
  ================================================================================
  Page Title
  ================================================================================
  Appears in the browser tab.
  -->
  <title>Register | Era Academy</title>

  <!-- 
  ================================================================================
  Bootstrap 5 CSS (CDN)
  ================================================================================
  Loads Bootstrap styles from CDN for quick development.
  -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 
  ================================================================================
  Custom CSS Styles
  ================================================================================
  Additional styling on top of Bootstrap for this specific page.
  -->
  <style>
    /* Light gray background for the whole page */
    body { 
      background: #f8fafc; 
    }

    /* 
    Centers the registration card both vertically and horizontally 
    using CSS Grid. min-height: 100vh makes it take full screen height.
    */
    .auth-wrapper { 
      display: grid; 
      place-items: center; 
      min-height: 100vh; 
      padding: 20px; 
    }

    /* 
    The white registration card.
    max-width limits how wide it gets on large screens.
    box-shadow adds a subtle depth effect.
    */
    .auth-card { 
      background: white; 
      border-radius: 12px; 
      padding: 2rem; 
      max-width: 440px; 
      width: 100%; 
      box-shadow: 0 10px 24px rgba(0,0,0,0.08); 
    }

    /* Makes form labels slightly bolder */
    .form-label { 
      font-weight: 600; 
      margin-bottom: 0.25rem; 
    }

    /* Custom input field styling */
    .form-control { 
      padding: 0.75rem 1rem; 
      border-radius: 8px; 
    }

    /* Makes the submit button full width with good padding */
    .btn { 
      width: 100%; 
      padding: 0.75rem; 
      font-weight: 600; 
    }

    /* Creates a thin horizontal line (used as a visual divider) */
    .divider { 
      height: 1px; 
      background: #095bc7; 
      margin: 1.5rem 0; 
    }
  </style>
</head>
<body>
  <!-- 
  ================================================================================
  MAIN WRAPPER
  ================================================================================
  Uses the custom .auth-wrapper class to center everything on the screen.
  -->
  <main class="auth-wrapper">
    
    <!-- 
    ================================================================================
    REGISTRATION CARD
    ================================================================================
    The main white container that holds the form.
    -->
    <div class="auth-card">
      
      <!-- Page Heading -->
      <h1 class="text-center mb-1">Create your account</h1>
      
      <!-- Subheading -->
      <p class="text-center text-muted mb-4">Start your learning journey today</p>

      <!-- 
      ================================================================================
      REGISTRATION FORM
      ================================================================================
      action="#" is a placeholder. In a real project, this would point to a backend endpoint.
      method="post" is used because we're sending data to the server.
      -->
      <form action="#" method="post">
        
        <!-- 
        ================================================================================
        FIRST NAME + LAST NAME ROW
        ================================================================================
        Uses Bootstrap grid to place two fields side by side on medium screens and larger.
        g-3 adds spacing between the columns.
        -->
        <div class="row g-3 mb-3">
          
          <!-- First Name Field -->
          <div class="col-md-6">
            <label class="form-label" for="firstName">First name</label>
            <input class="form-control" id="firstName" name="firstName" type="text" placeholder="Jane" required>
          </div>

          <!-- Last Name Field -->
          <div class="col-md-6">
            <label class="form-label" for="lastName">Last name</label>
            <input class="form-control" id="lastName" name="lastName" type="text" placeholder="Doe" required>
          </div>
        </div>

        <!-- 
        ================================================================================
        EMAIL FIELD
        ================================================================================
        type="email" enables browser email validation.
        -->
        <div class="mb-3">
          <label class="form-label" for="email">Email address</label>
          <input class="form-control" id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>

        <!-- 
        ================================================================================
        PASSWORD FIELD
        ================================================================================
        minlength="8" adds basic client-side validation.
        -->
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" placeholder="At least 8 characters" minlength="8" required>
          <!-- Helpful hint text -->
          <small class="text-muted">Use 8+ characters with letters and numbers</small>
        </div>

        <!-- 
        ================================================================================
        TERMS & CONDITIONS CHECKBOX
        ================================================================================
        form-check is Bootstrap's class for styled checkboxes.
        required makes the form un-submittable until checked.
        -->
        <div class="mb-3 form-check">
          <input class="form-check-input" type="check" id="terms" required>
          <label class="form-check-label" for="terms">I agree to the Terms of Service</label>
        </div>

        <!-- Submit Button -->
        <button class="btn btn-primary mb-3" type="submit">Create Account</button>

        <!-- 
        ================================================================================
        VISUAL DIVIDER
        ================================================================================
        Uses the custom .divider class to create a thin horizontal line.
        -->
        <div class="divider"></div>

        <!-- Login / Contact Link -->
        <p class="text-center mb-0">
          Already have an account? 
          <a href="index.html#contact">Contact us</a>
        </p>

      </form>
    </div>
  </main>
</body>
</html>
